CONFIG_CHIP=y
CONFIG_STD_CPP17=y
CONFIG_REBOOT=y

CONFIG_SETTINGS=y
CONFIG_MATTER_PROVISIONING_DEFER_SETTINGS_INIT=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=1024

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=24576

CONFIG_MBEDTLS=y
CONFIG_PSA_CRYPTO=y
CONFIG_CHIP_CRYPTO_PSA=y
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=256
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_PARSE_C=y
CONFIG_MBEDTLS_PEM_WRITE_C=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y

CONFIG_SHELL=n
CONFIG_BT=n
CONFIG_NET_L2_OPENTHREAD=n
CONFIG_OPENTHREAD=n
CONFIG_DNS_SD=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=n
CONFIG_CHIP_OTA_REQUESTOR=n

CONFIG_POSIX_AEP_CHOICE_NONE=y
CONFIG_THREAD_LOCAL_STORAGE=y
