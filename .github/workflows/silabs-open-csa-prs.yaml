name: Open PRs from CSA branches

on:
    workflow_run:
        workflows: ["Daily Sync of CSA branches"]
        types:
            - completed
    workflow_dispatch:

jobs:
    monthly-window:
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        outputs:
            run: ${{ steps.check.outputs.run }}
        steps:
            - name: Open the monthly PR on the 1st or when the sync was dispatched manually
              id: check
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event.workflow_run.event }}" == "workflow_dispatch" || "$(date -u +%d)" == "01" ]]; then
                      echo "run=true" >> "${GITHUB_OUTPUT}"
                  else
                      echo "run=false" >> "${GITHUB_OUTPUT}"
                  fi

    open-pr:
        needs: monthly-window
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (matrix.cadence != 'monthly' || needs.monthly-window.outputs.run == 'true') }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - local_branch: csa
                      base_branch: main
                      cadence: daily
                    - local_branch: csa-v1.6.1-branch
                      base_branch: release_2.10-1.6.1
                      cadence: daily
                    - local_branch: csa-v1.6-branch
                      base_branch: v1.6-branch
                      cadence: monthly

        steps:
            - name: Generate token for the workflow
              id: generate_token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.SILABSSW_MATTER_CI_BOT_APP_ID }}
                  private-key: ${{ secrets.SILABSSW_MATTER_CI_BOT_APP_PRIVATE_KEY }}
            - name: Mask the generated token
              run: echo "::add-mask::${{ steps.generate_token.outputs.token }}"

            - uses: actions/checkout@v7
              with:
                  ref: ${{ matrix.base_branch }}
                  persist-credentials: false

            - name: Checkout ${{ matrix.local_branch }}
              run: |
                  git fetch origin ${{ matrix.local_branch }}:${{ matrix.local_branch }}
                  git reset --hard ${{ matrix.local_branch }}

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v8
              with:
                  branch: automation/update_${{ matrix.base_branch }}
                  base: ${{ matrix.base_branch }}
                  title: Sync ${{ matrix.local_branch }} branch with ${{ matrix.base_branch }}
                  body: |
                      This PR syncs the ${{ matrix.local_branch }} branch with the ${{ matrix.base_branch }} branch.

                      **PR MUST BE MERGED WITH MERGE COMMIT - ADMIN MUST ENABLE THE OPTION**
                  token: ${{ steps.generate_token.outputs.token }}
                  labels: changing-git-submodules-on-purpose, sl-require-admin-action
