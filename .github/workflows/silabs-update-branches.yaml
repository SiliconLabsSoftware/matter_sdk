name: Daily Sync of CSA branches

on:
    schedule:
        - cron: "0 0 * * *" # Runs once a day at midnight
    workflow_dispatch: # Allows manual triggering of the workflow

jobs:
    monthly-window:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            run: ${{ steps.check.outputs.run }}
        steps:
            - name: Run monthly sync on the 1st or when dispatched manually
              id: check
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u +%d)" == "01" ]]; then
                      echo "run=true" >> "${GITHUB_OUTPUT}"
                  else
                      echo "run=false" >> "${GITHUB_OUTPUT}"
                  fi

    sync:
        needs: monthly-window
        if: github.ref == 'refs/heads/main' && (matrix.cadence != 'monthly' || needs.monthly-window.outputs.run == 'true')
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - local_branch: csa
                      upstream_branch: master
                      cadence: daily
                    - local_branch: csa-v1.6.1-branch
                      upstream_branch: v1.6.1-branch
                      cadence: daily
                    # Synced from upstream v1.6-branch on the 1st, or on manual dispatch.
                    - local_branch: csa-v1.6-branch
                      upstream_branch: v1.6-branch
                      cadence: monthly

        steps:
            - name: Generate token for the workflow
              id: generate_token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.SILABSSW_MATTER_CI_BOT_APP_ID }}
                  private-key:
                      ${{ secrets.SILABSSW_MATTER_CI_BOT_APP_PRIVATE_KEY }}
            - name: Mask the generated token
              run: echo "::add-mask::${{ steps.generate_token.outputs.token }}"

            - name: Checkout matter_sdk::${{ matrix.local_branch }} branch
              uses: actions/checkout@v7
              with:
                  repository: SiliconLabsSoftware/matter_sdk
                  ref: ${{ matrix.local_branch }}
                  token: ${{ steps.generate_token.outputs.token }}

            - name: Add CSA repository remote
              run: |
                  git remote add upstream https://github.com/project-chip/connectedhomeip.git

            - name: Update the ${{ matrix.local_branch }} branch locally
              run: git pull upstream ${{ matrix.upstream_branch }}

            - name: Push the updated ${{ matrix.local_branch }} branch to the remote
              run: |
                  git push origin ${{ matrix.local_branch }}
